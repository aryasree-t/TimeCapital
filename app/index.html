<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFFFFF">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Time Capital">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<title>Time is capital</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
html,body{margin:0;background:#fff;font-family:'Montserrat',system-ui,-apple-system,sans-serif;color:#0F1B23;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button,input{font-family:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation}
a{color:#1891B2}
#app{max-width:480px;margin:0 auto;min-height:100dvh;padding:calc(env(safe-area-inset-top) + 10px) 0 calc(env(safe-area-inset-bottom) + 36px)}
.px{padding-left:24px;padding-right:24px}
.eyebrow{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:#6B7983}
.top{display:flex;gap:8px;align-items:center;padding:8px 24px 0}
.seg{flex:1;display:flex;gap:4px;padding:4px;background:#EEF1F3;border-radius:12px}
.seg button{flex:1;height:36px;border:none;border-radius:9px;background:transparent;font-size:13px;font-weight:600}
.seg button.on{background:#fff}
.btn-o{height:44px;padding:0 14px;border-radius:12px;border:1px solid #E1E5E8;background:#fff;font-size:13px;font-weight:600;display:inline-flex;align-items:center;justify-content:center}
.btn{height:52px;border-radius:14px;border:none;background:#0F1B23;color:#fff;font-size:16px;font-weight:600;width:100%}
.btn:disabled{background:#C3CAD0}
.big{font-size:60px;font-weight:700;letter-spacing:-.03em;line-height:1;font-variant-numeric:tabular-nums}
.muted{font-size:14px;font-weight:300;color:#485863;text-wrap:pretty}
.bar{position:relative;height:14px;border-radius:7px;background:#F6F8F9;border:1px solid #E1E5E8;overflow:hidden}
.bar>div{position:absolute;top:0;bottom:0}
.run{margin:20px 24px 0;padding:16px;border-radius:16px;background:#0F1B23;color:#fff;display:flex;align-items:center;gap:14px}
.prompt{margin:20px 24px 0;padding:16px;border-radius:16px;background:#FEF5E6;display:flex;align-items:center;gap:14px}
.circles{display:grid;grid-template-columns:repeat(3,1fr);gap:20px 12px;padding:22px 24px 0;justify-items:center}
.circle{position:relative;width:88px;height:88px;border-radius:50%;border:none;padding:0}
.circle:active,.pill:active{transform:scale(.96)}
.circle .in{position:absolute;inset:7px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:34px;line-height:1}
.due{position:absolute;top:2px;right:2px;width:14px;height:14px;border-radius:50%;background:#FBB040;border:2.5px solid #fff}
.pills{display:flex;flex-wrap:wrap;gap:8px}
.pill{position:relative;display:flex;align-items:center;gap:8px;height:44px;padding:0 16px 0 12px;border-radius:999px;border:1px solid #E1E5E8;background:#fff;font-size:14px;font-weight:600}
.pill .due{top:-2px;right:-2px;width:12px;height:12px;border-width:2px}
.dash{height:52px;border-radius:14px;border:1.5px dashed #C3CAD0;background:#fff;font-size:15px;font-weight:600;width:100%}
.chips{display:flex;gap:6px;padding:18px 24px 0;overflow-x:auto;scrollbar-width:none}
.chip{flex-shrink:0;display:flex;align-items:center;gap:6px;height:34px;padding:0 12px;border-radius:999px;border:1px solid #E1E5E8;background:#fff;font-size:12px;font-weight:600}
.chip.on{background:#EAF7FB;border-color:#6FC5DD}
.row{display:flex;align-items:center;gap:14px;min-height:60px;border:none;border-bottom:1px solid #EEF1F3;background:transparent;padding:0;width:100%;text-align:left}
.stat{padding:12px;border-radius:12px;background:#F6F8F9;display:flex;flex-direction:column;gap:2px}
.card{display:flex;gap:12px;align-items:flex-start;padding:14px;border-radius:14px;background:#F6F8F9}
.scrim{position:fixed;inset:0;background:rgba(15,27,35,.4);display:flex;align-items:flex-end;justify-content:center;z-index:10}
.sheet{width:100%;max-width:480px;max-height:92dvh;overflow-y:auto;-webkit-overflow-scrolling:touch;background:#fff;border-radius:24px 24px 0 0;padding:26px 24px calc(env(safe-area-inset-bottom) + 28px);display:flex;flex-direction:column;gap:16px}
.sh-head{display:flex;justify-content:space-between;align-items:center}
.step{width:38px;height:38px;border-radius:10px;border:1px solid #E1E5E8;background:#fff;font-size:18px;font-weight:500;flex-shrink:0}
.step.off{background:#F6F8F9;color:#96A1A9}
.val{width:64px;text-align:center;font-size:15px;font-weight:600;font-variant-numeric:tabular-nums}
.link{border:none;background:none;font-size:14px;font-weight:600;color:#1891B2;padding:6px}
.h2{font-size:24px;font-weight:700;letter-spacing:-.02em;line-height:1.25;text-wrap:pretty}
.opts{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.opt{height:56px;border-radius:14px;border:1.5px solid #E1E5E8;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px}
.opt.on{border-color:#1FA8CD;background:#EAF7FB}
.tags{display:flex;flex-wrap:wrap;gap:8px}
.tag{height:36px;padding:0 12px;border-radius:999px;border:1px solid #E1E5E8;background:#fff;font-size:12px;font-weight:600}
.tag.on{background:#EAF7FB;border-color:#6FC5DD}
.field{height:46px;border-radius:12px;border:1px solid #E1E5E8;padding:0 14px;font-size:16px;font-weight:500;outline:none;width:100%;background:#fff;min-width:0}
.field:focus{border-color:#1FA8CD;box-shadow:0 0 0 3px rgba(31,168,205,.28)}
.warn{padding:12px 14px;border-radius:12px;background:#FEF5E6;font-size:13px;font-weight:500;line-height:1.45;color:#452A05}
.box{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:14px;background:#F6F8F9}
.sip{display:flex;flex-direction:column;gap:10px;padding:14px 0;border-bottom:1px solid #EEF1F3}
.emo{width:46px;height:46px;border-radius:12px;border:1px solid #E1E5E8;background:#fff;font-size:22px;flex-shrink:0}
.egrid{display:grid;grid-template-columns:repeat(8,1fr);gap:6px}
.egrid button{height:40px;border-radius:10px;border:1px solid #EEF1F3;background:#fff;font-size:20px;padding:0}
.cdot{width:28px;height:28px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 1px #E1E5E8;flex-shrink:0}
.x{width:38px;height:38px;border-radius:10px;border:none;background:transparent;color:#96A1A9;font-size:20px;flex-shrink:0}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom) + 24px);padding:14px 18px;border-radius:14px;background:#0F1B23;color:#fff;font-size:14px;font-weight:600;z-index:20;max-width:90vw;text-align:center}
</style>
</head>
<body>
<div id="app"></div>
<script>
const KEY = 'tic.v1';
const MISC = { id: 'misc', name: 'Misc', emoji: '✨', color: '#96A1A9' };
const COLORS = ['#6FC7B4', '#1FA8CD', '#FBB040', '#EFB3C7', '#6B7983', '#E0564B', '#8B7FD6', '#3D8575'];
const EMOJIS = ['🏃', '📚', '🛠️', '🫶', '⚙️', '🧘', '💼', '✍️', '🎨', '🎸', '🧠', '🍳', '💰', '🌱', '🗣️', '📈', '💻', '🏋️', '🚴', '🎯', '📝', '🧹', '👨‍👩‍👧', '🙏'];
const RATE = [{ l: 'Dropped', d: -2 }, { l: 'Held', d: 0 }, { l: 'Improved', d: 2 }, { l: 'Improved a lot', d: 5 }];
const FEEL = ['More energy', 'Sharper', 'Things got easier', 'More confident', 'Closer to people', 'Calmer', 'Slept better'];
const WD = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
const MO = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];

const pad = n => String(n).padStart(2, '0');
const dstr = (d = new Date()) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const pd = s => { const [y, m, d] = s.split('-').map(Number); return Date.UTC(y, m - 1, d); };
const days = (a, b) => Math.round((pd(b) - pd(a)) / 864e5);
const addDays = (s, n) => { const t = new Date(pd(s) + n * 864e5); return `${t.getUTCFullYear()}-${pad(t.getUTCMonth() + 1)}-${pad(t.getUTCDate())}`; };
const fmt = m => { m = Math.max(0, Math.round(m)); const h = Math.floor(m / 60), mm = m % 60; return h ? `${h}h ${pad(mm)}m` : `${mm}m`; };
const mss = ms => { const t = Math.max(0, Math.floor(ms / 1000)), h = Math.floor(t / 3600), m = Math.floor(t % 3600 / 60), s = t % 60; return h ? `${h}:${pad(m)}:${pad(s)}` : `${m}:${pad(s)}`; };
const hm = ms => { const d = new Date(ms); return `${pad(d.getHours())}:${pad(d.getMinutes())}`; };
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const uid = () => Math.random().toString(36).slice(2, 9);
const pct = (a, b) => Math.round((a / b - 1) * 100);
const sign = n => `${n >= 0 ? '+' : '−'}${Math.abs(n)}%`;
const cap1 = s => s ? s[0].toUpperCase() + s.slice(1) : s;
const today = () => dstr();

function mkSip(id, name, emoji, color, goal, signal, countable) {
  const t = today();
  return { id, name, emoji, color, goal, signal, countable: !!countable, idx: 100, idxDate: t, lastInv: t, lastCheck: t, sinceMin: 0, hist: [{ d: t, v: 100 }], saved: 0 };
}
function defaults() {
  return {
    v: 1, capital: 960, wake: '07:00', checkH: 5, checkD: 3, entries: [], run: null, journal: [],
    sips: [
      mkSip('body', 'Body', '🏃', '#6FC7B4', 60, 'energy'),
      mkSip('mind', 'Mind', '📚', '#1FA8CD', 60, 'clarity'),
      mkSip('craft', 'Craft', '🛠️', '#FBB040', 360, 'skill'),
      mkSip('people', 'People', '🫶', '#EFB3C7', 0, 'connection'),
      mkSip('systems', 'Systems', '⚙️', '#6B7983', 0, 'day-to-day ease', true),
    ],
  };
}
let S;
try { S = JSON.parse(localStorage.getItem(KEY)); } catch (e) { S = null; }
if (!S || !Array.isArray(S.sips)) S = defaults();
const persist = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} };
let U = { tab: 'today', sel: null, sheet: null, toast: null };

const sipById = id => id === 'misc' ? MISC : S.sips.find(s => s.id === id);
const wakeMs = () => { const [h, m] = S.wake.split(':').map(Number); const d = new Date(); d.setHours(h, m, 0, 0); return d.getTime(); };
const runMin = () => S.run ? (Date.now() - S.run.start) / 6e4 : 0;
const loggedToday = id => { const t = today(); return S.entries.filter(e => e.date === t && e.sip === id).reduce((a, e) => a + e.min, 0); };
const todayMin = id => Math.max(0, loggedToday(id) + (S.run && S.run.sip === id ? runMin() : 0));
const totalMin = id => S.entries.filter(e => e.sip === id).reduce((a, e) => a + e.min, 0);
const rate = d => d <= 2 ? 0 : d <= 7 ? 0.005 : d <= 14 ? 0.01 : 0.015;
const gapOf = s => { const t = today(); return { gap: Math.max(0, days(s.lastInv, t)), anchor: Math.max(0, days(s.lastInv, s.idxDate)) }; };
function cur(s) { const { gap, anchor } = gapOf(s); let f = 1; for (let d = anchor + 1; d <= gap; d++) f *= 1 - rate(d); return Math.max(Math.min(s.idx, 100), s.idx * f); }
function cooling(s) { const { gap, anchor } = gapOf(s); return gap > 2 && gap > anchor && !(S.run && S.run.sip === s.id); }
function valueAt(s, d) { let v = 100; for (const h of s.hist) if (h.d <= d) v = h.v; return v; }
function setHist(s, v) { const t = today(); s.hist = s.hist.filter(h => h.d !== t); s.hist.push({ d: t, v }); }
function due(s) { const live = S.run && S.run.sip === s.id ? runMin() : 0; return s.sinceMin + live >= S.checkH * 60 || days(s.lastCheck, today()) >= S.checkD; }
function onInvest(id, min) {
  const s = sipById(id); if (!s || id === 'misc') return 0;
  let rec = 0;
  if (min > 0 && cooling(s)) { const c0 = cur(s), nv = c0 + (s.idx - c0) * 0.5; rec = Math.round(nv) - Math.round(c0); s.idx = nv; s.idxDate = today(); setHist(s, nv); s.recovering = today(); }
  if (min > 0) s.lastInv = today();
  s.sinceMin = Math.max(0, s.sinceMin + min);
  return rec;
}
function dateLabel(d) { const n = days(d, today()); if (n === 0) return 'Today'; if (n === 1) return 'Yesterday'; if (n < 7) return WD[new Date(pd(d)).getUTCDay()].slice(0, 3); const x = new Date(pd(d)); return `${x.getUTCDate()} ${MO[x.getUTCMonth()]}`; }
function sinceLabel(d) { const n = days(d, today()); if (n === 0) return 'earlier today'; if (n === 1) return 'yesterday'; if (n < 7) return WD[new Date(pd(d)).getUTCDay()]; return `${n} days ago`; }
function toast(msg) { U.toast = msg; render(); clearTimeout(toast.t); toast.t = setTimeout(() => { U.toast = null; render(); }, 2600); }

function topBar() {
  return `<div class="top"><div class="seg"><button class="${U.tab === 'today' ? 'on' : ''}" data-a="tab" data-v="today">Today</button><button class="${U.tab === 'returns' ? 'on' : ''}" data-a="tab" data-v="returns">Returns</button></div><button class="btn-o" data-a="settings">Settings</button></div>`;
}

function todayView() {
  const now = Date.now(), w = wakeMs(), cap = S.capital, capD = Math.max(1, cap);
  const el = now < w ? 0 : Math.min(cap, (now - w) / 6e4);
  const all = [...S.sips, MISC], inv = all.reduce((a, s) => a + todayMin(s.id), 0), t = today();
  const endT = cap >= 1440 ? `${S.wake} tomorrow` : hm(w + cap * 6e4);
  const segs = S.entries.filter(e => e.date === t && e.kind === 'timer').map(e => ({ s: e.start, e: e.end, c: (sipById(e.sip) || MISC).color }));
  if (S.run) segs.push({ s: S.run.start, e: now, c: '#0F1B23' });
  const segH = segs.map(g => { const l = Math.max(0, (g.s - w) / 6e4 / capD * 100), r = Math.min(100, (g.e - w) / 6e4 / capD * 100); return r > l ? `<div style="left:${l}%;width:${r - l}%;background:${g.c}"></div>` : ''; }).join('');
  const pastW = el / capD * 100;
  let h = `<div class="px" style="padding-top:26px;display:flex;flex-direction:column;gap:6px"><div class="eyebrow">Today's capital</div><div class="big">${fmt(cap - el)}</div><div class="muted">${now < w ? `Your day starts at ${S.wake}.` : `left until ${endT}. It spends itself either way.`}</div></div>
  <div class="px" style="padding-top:20px;display:flex;flex-direction:column;gap:10px"><div class="bar"><div style="left:0;width:${pastW}%;background:#E1E5E8"></div>${segH}<div style="left:${pastW}%;width:2px;background:#0F1B23"></div></div>
  <div style="display:flex;justify-content:space-between;font-size:13px;color:#485863"><span><strong style="font-weight:600;color:#0F1B23">${fmt(inv)}</strong> invested</span><span>${fmt(el - inv)} passed</span></div></div>`;
  if (S.run) {
    const s = sipById(S.run.sip) || MISC, g = s.goal || 0, tm = todayMin(s.id);
    const gl = g ? (tm >= g ? `Today's ${esc(s.name)} goal met` : `${fmt(g - tm)} to today's goal`) : '';
    h += `<div class="run"><div style="font-size:28px;line-height:1">${s.emoji}</div><div style="flex:1;display:flex;flex-direction:column;min-width:0"><span style="font-size:13px;font-weight:300;color:#C3CAD0">Investing in ${esc(s.name)}</span><span style="font-size:24px;font-weight:700;font-variant-numeric:tabular-nums">${mss(now - S.run.start)}</span>${gl ? `<span style="font-size:12px;font-weight:500;color:${tm >= g ? '#6FC7B4' : '#C3CAD0'}">${gl}</span>` : ''}</div><button data-a="stop" style="height:42px;padding:0 18px;border-radius:12px;border:none;background:#fff;color:#0F1B23;font-size:14px;font-weight:600">Stop</button></div>`;
  }
  const dueS = !S.run && S.sips.find(due);
  if (dueS) {
    const why = dueS.sinceMin >= S.checkH * 60 ? `${esc(dueS.name)} · ${fmt(dueS.sinceMin)} invested since last check-in` : `${esc(dueS.name)} · ${days(dueS.lastCheck, t)} days since last check-in`;
    h += `<div class="prompt"><div style="flex:1;display:flex;flex-direction:column;gap:2px"><span style="font-size:15px;font-weight:600;color:#452A05">How's your ${esc(dueS.signal)}?</span><span style="font-size:13px;color:#6F4408">${why}</span></div><button data-a="check" data-id="${dueS.id}" style="height:42px;padding:0 16px;border-radius:12px;border:none;background:#0F1B23;color:#fff;font-size:14px;font-weight:600">Check in</button></div>`;
  }
  const gs = S.sips.filter(s => s.goal > 0), ns = S.sips.filter(s => !s.goal);
  const metN = gs.filter(s => todayMin(s.id) >= s.goal).length, gTot = gs.reduce((a, s) => a + s.goal, 0), gDone = gs.reduce((a, s) => a + Math.min(todayMin(s.id), s.goal), 0);
  const summary = gs.length ? (metN === gs.length ? 'All goals met today' : `${fmt(gDone)} of ${fmt(gTot)} · ${metN}/${gs.length} met`) : '';
  h += `<div class="px" style="padding-top:24px;display:flex;justify-content:space-between;align-items:baseline"><span class="eyebrow">Daily SIP</span><span style="font-size:13px;font-weight:600;color:${gs.length && metN === gs.length ? '#3D8575' : '#485863'}">${summary}</span></div>`;
  if (gs.length) {
    h += `<div class="circles">` + gs.map(s => {
      const tm = todayMin(s.id), p = Math.min(100, tm / s.goal * 100), met = tm >= s.goal, on = S.run && S.run.sip === s.id, dim = S.run && !on;
      return `<button class="circle" data-a="start" data-id="${s.id}" aria-label="${esc(s.name)}" style="background:conic-gradient(${s.color} ${p}%, #EEF1F3 0);opacity:${dim ? 0.4 : 1};box-shadow:${on ? '0 0 0 3px #fff,0 0 0 5px #0F1B23' : 'none'}"><div class="in" style="background:${met ? `color-mix(in oklch, ${s.color} 22%, #fff)` : '#fff'}">${s.emoji}</div>${due(s) ? '<div class="due"></div>' : ''}</button>`;
    }).join('') + `</div>`;
  } else h += `<div class="px muted" style="padding-top:12px">No daily goals yet. Set one in Settings.</div>`;
  const pill = (s, misc) => {
    const tm = todayMin(s.id), on = S.run && S.run.sip === s.id, dim = S.run && !on;
    return `<button class="pill" data-a="${misc ? 'retro' : 'start'}" data-id="${s.id}" aria-label="${esc(s.name)}" style="background:${tm ? `color-mix(in oklch, ${s.color} 16%, #fff)` : '#fff'};border-color:${tm ? `color-mix(in oklch, ${s.color} 45%, #fff)` : '#E1E5E8'};color:${tm ? '#0F1B23' : '#6B7983'};opacity:${dim ? 0.4 : 1};box-shadow:${on ? '0 0 0 2px #fff,0 0 0 4px #0F1B23' : 'none'}"><span style="font-size:20px;line-height:1">${s.emoji}</span><span style="font-variant-numeric:tabular-nums">${fmt(tm)}</span>${!misc && due(s) ? '<div class="due"></div>' : ''}</button>`;
  };
  h += `<div class="px" style="padding-top:26px;display:flex;flex-direction:column;gap:10px"><div class="eyebrow">Also logging · no goal</div><div class="pills">${ns.map(s => pill(s)).join('')}${pill(MISC, true)}</div></div>`;
  h += `<div class="px" style="padding-top:26px"><button class="dash" data-a="retro">+ Log time you didn't track</button></div>`;
  return h;
}

function returnsView() {
  const t = today(), sel = U.sel && S.sips.find(s => s.id === U.sel), keys = sel ? [sel] : S.sips;
  const wt = s => Math.max(0, totalMin(s.id)) + 60, wSum = keys.reduce((a, s) => a + wt(s), 0);
  const wv = d => keys.reduce((a, s) => a + valueAt(s, d) * wt(s), 0) / wSum;
  const ser = Array.from({ length: 12 }, (_, i) => wv(addDays(t, -(11 - i) * 7)));
  const gNow = keys.reduce((a, s) => a + cur(s) * wt(s), 0) / wSum, dec = keys.some(cooling);
  const lo = Math.min(98, gNow, ...ser) - 2, hi = Math.max(gNow, ...ser) + 2, y = v => 100 - (v - lo) / (hi - lo) * 100;
  const P = (v, i) => `${(i / 12 * 300).toFixed(1)},${y(v).toFixed(1)}`;
  const solid = ser.map(P); if (!dec) solid.push(P(gNow, 12));
  const dash = dec ? `${P(ser[11], 11)} ${P(gNow, 12)}` : '';
  const area = `0,100 ${solid.join(' ')} ${dec ? P(gNow, 12) + ' ' : ''}300,100`;
  const lc = sel ? sel.color : '#1FA8CD', gTr = pct(gNow, wv(addDays(t, -30))), gStart = pct(gNow, 100);
  const selCool = sel && cooling(sel);
  const sub = selCool ? `No ${esc(sel.name)} for ${gapOf(sel).gap} days. Your ${esc(sel.signal)} is easing from ${Math.round(sel.idx)} to ${Math.round(gNow)}. One session stops it.`
    : sel ? `${fmt(totalMin(sel.id))} of ${esc(sel.name)} moved your ${esc(sel.signal)} from 100 to ${Math.round(gNow)}.`
    : dec ? `${sign(gStart)} since you started. Dashed: estimated wear on areas you've been away from.` : `${sign(gStart)} since you started. Weighted by the time you put into each area.`;
  let h = `<div class="chips"><button class="chip ${!sel ? 'on' : ''}" data-a="sel" data-id="">All</button>${S.sips.map(s => `<button class="chip ${sel && sel.id === s.id ? 'on' : ''}" data-a="sel" data-id="${s.id}"><span>${s.emoji}</span>${esc(s.name)}</button>`).join('')}</div>
  <div class="px" style="padding-top:22px;display:flex;flex-direction:column;gap:6px"><div class="eyebrow">${sel ? `${esc(sel.name)} index · ${esc(sel.signal)}` : 'Portfolio index'}</div>
  <div style="display:flex;align-items:baseline;gap:10px"><span style="font-size:48px;font-weight:700;letter-spacing:-.03em;line-height:1;font-variant-numeric:tabular-nums">${Math.round(gNow)}</span><span style="font-size:15px;font-weight:600;color:${gTr >= 0 ? '#3D8575' : '#8A2018'}">${sign(gTr)} this month</span></div><div class="muted">${sub}</div></div>
  <div class="px" style="padding-top:16px;display:flex;flex-direction:column;gap:6px"><div style="position:relative;height:110px"><svg viewBox="0 0 300 100" preserveAspectRatio="none" style="position:absolute;inset:0;width:100%;height:100%;overflow:visible">
  <line x1="0" y1="${y(100).toFixed(1)}" x2="300" y2="${y(100).toFixed(1)}" stroke="#C3CAD0" stroke-width="1" stroke-dasharray="3 4" vector-effect="non-scaling-stroke"/>
  <polygon points="${area}" fill="${lc}" fill-opacity="0.1"/><polyline points="${solid.join(' ')}" fill="none" stroke="${lc}" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/>
  ${dash ? `<polyline points="${dash}" fill="none" stroke="${lc}" stroke-width="2.5" stroke-dasharray="4 4" stroke-linecap="round" vector-effect="non-scaling-stroke"/>` : ''}</svg>
  <div style="position:absolute;left:0;top:${y(100)}%;transform:translateY(-120%);font-size:11px;color:#6B7983">100 · where you started</div></div>
  <div style="display:flex;justify-content:space-between;font-size:11px;color:#6B7983"><span>12 weeks ago</span><span>${dec ? 'Now (estimated)' : 'Now'}</span></div></div>`;
  const J = S.journal.filter(j => !sel || j.sip === sel.id);
  if (!sel) {
    h += `<div class="px" style="padding-top:14px;display:flex;flex-direction:column">` + S.sips.map(s => {
      const tr = pct(cur(s), valueAt(s, addDays(t, -30))), cool = cooling(s), rec = s.recovering === t;
      const sb = cool ? `Cooling · ${gapOf(s).gap} days away` : rec ? 'Recovering · back today' : `${fmt(totalMin(s.id))} in · ${esc(s.signal)}`;
      return `<button class="row" data-a="sel" data-id="${s.id}"><span style="font-size:20px;width:26px;text-align:center">${s.emoji}</span><span style="flex:1;display:flex;flex-direction:column;min-width:0"><span style="font-size:16px;font-weight:600">${esc(s.name)}</span><span style="font-size:13px;font-weight:${cool || rec ? 500 : 300};color:${cool ? '#6F4408' : rec ? '#3D8575' : '#6B7983'}">${sb}</span></span><span style="font-size:13px;font-weight:600;color:${tr >= 0 ? '#3D8575' : '#8A2018'}">${sign(tr)}</span><span style="font-size:20px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums;width:44px;text-align:right">${Math.round(cur(s))}</span></button>`;
    }).join('') + `</div>`;
  } else {
    const tally = {}; J.forEach(j => (j.tags || []).forEach(x => tally[x] = (tally[x] || 0) + 1));
    const tl = Object.entries(tally).sort((a, b) => b[1] - a[1]).slice(0, 4), tMax = tl.length ? tl[0][1] : 1;
    const third = sel.countable ? [fmt(sel.saved), 'time saved'] : [sign(pct(cur(sel), valueAt(sel, addDays(t, -30)))), 'this month'];
    h += `<div class="px" style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding-top:16px"><div class="stat"><span style="font-size:17px;font-weight:700">${fmt(totalMin(sel.id))}</span><span style="font-size:12px;font-weight:300;color:#6B7983">invested</span></div><div class="stat"><span style="font-size:17px;font-weight:700">${J.length}</span><span style="font-size:12px;font-weight:300;color:#6B7983">check-ins</span></div><div class="stat"><span style="font-size:17px;font-weight:700">${third[0]}</span><span style="font-size:12px;font-weight:300;color:#6B7983">${third[1]}</span></div></div>`;
    if (tl.length) h += `<div class="px eyebrow" style="padding-top:20px">What it gives you most</div><div class="px" style="display:flex;flex-direction:column;gap:8px;padding-top:10px">${tl.map(([l, n]) => `<div style="display:flex;align-items:center;gap:10px"><span style="width:120px;font-size:13px;font-weight:500">${esc(l)}</span><div style="flex:1;height:8px;border-radius:4px;background:#EEF1F3;overflow:hidden"><div style="height:100%;width:${n / tMax * 100}%;background:${sel.color};border-radius:4px"></div></div><span style="width:24px;text-align:right;font-size:13px;font-weight:600;color:#485863">${n}</span></div>`).join('')}</div>`;
    h += `<div class="px" style="padding-top:18px"><button class="btn-o" style="width:100%;height:48px;font-size:15px" data-a="check" data-id="${sel.id}">Check in on ${esc(sel.name)}</button></div>`;
  }

  h += J.length ? J.slice(0, 30).map(j => {
    const s = sipById(j.sip) || { emoji: '•', signal: '', name: '' }, r = RATE[j.rate] || RATE[1];

  }).join('') : `<div class="muted">No check-ins yet. They appear after ${S.checkH}h invested in an area, or every ${S.checkD} days.</div>`;
  return h + `</div>`;
}

function settingsSheet(sh) {
  const w = wakeMs(), endT = S.capital >= 1440 ? `${S.wake} tomorrow` : hm(w + S.capital * 6e4);
  const gTot = S.sips.reduce((a, s) => a + (s.goal || 0), 0), over = gTot > S.capital;
  let h = `<div class="sh-head"><div class="eyebrow">Settings</div><button class="link" data-a="close">Done</button></div>
  <div class="box"><div style="flex:1;display:flex;flex-direction:column;gap:2px"><span style="font-size:16px;font-weight:600">Daily capital</span><span style="font-size:12px;font-weight:300;color:#6B7983">Until ${endT}</span></div><button class="step" data-a="cap" data-v="-30">−</button><span class="val">${fmt(S.capital)}</span><button class="step" data-a="cap" data-v="30">+</button></div>
  <div class="box"><span style="flex:1;font-size:15px;font-weight:600">Day starts at</span><input type="time" class="field" style="width:120px" value="${S.wake}" data-c="wake"></div>
  <div class="box" style="flex-wrap:wrap"><span style="flex:1 1 100%;font-size:15px;font-weight:600">Check in after</span><button class="step" data-a="ch" data-v="-1">−</button><span class="val">${S.checkH}h</span><button class="step" data-a="ch" data-v="1">+</button><span style="flex:1;text-align:center;font-size:13px;color:#6B7983">or</span><button class="step" data-a="cd" data-v="-1">−</button><span class="val">${S.checkD} d</span><button class="step" data-a="cd" data-v="1">+</button></div>
  <div style="display:flex;flex-direction:column;gap:4px;padding-top:6px"><div class="eyebrow">Your SIPs</div><div style="font-size:14px;font-weight:400;color:${over ? '#8A2018' : '#485863'}">${over ? `Goals add up to ${fmt(gTot)}, more than your ${fmt(S.capital)} capital.` : `Goals add up to ${fmt(gTot)} a day, ${Math.round(gTot / Math.max(1, S.capital) * 100)}% of your capital.`}</div></div><div>`;
  h += S.sips.map(s => `<div class="sip"><div style="display:flex;align-items:center;gap:10px"><button class="emo" data-a="emo" data-id="${s.id}">${s.emoji}</button><input class="field" value="${esc(s.name)}" data-c="name" data-id="${s.id}" maxlength="24" aria-label="Name"><button class="cdot" style="background:${s.color}" data-a="color" data-id="${s.id}" aria-label="Colour"></button><button class="x" data-a="del" data-id="${s.id}" aria-label="Delete">×</button></div>
  ${sh.emojiFor === s.id ? `<div class="egrid">${EMOJIS.map(e => `<button data-a="pick" data-id="${s.id}" data-v="${e}">${e}</button>`).join('')}</div>` : ''}
  <div style="display:flex;align-items:center;gap:10px"><span style="flex:1;font-size:13px;color:#485863">Daily goal</span><button class="step" data-a="goal" data-id="${s.id}" data-v="-15">−</button><span class="val">${s.goal ? fmt(s.goal) : 'Off'}</span><button class="step" data-a="goal" data-id="${s.id}" data-v="15">+</button></div>
  <div style="display:flex;align-items:center;gap:10px"><span style="flex:1;font-size:13px;color:#485863;white-space:nowrap">Check-ins ask about</span><input class="field" style="height:40px;width:170px;flex:none" value="${esc(s.signal)}" data-c="signal" data-id="${s.id}" maxlength="24"></div></div>`).join('');
  h += `</div><button class="btn-o" style="height:48px;font-size:15px" data-a="add">+ Add SIP</button>
  <div class="eyebrow" style="padding-top:10px">Your data</div><div class="muted" style="margin-top:-8px">Stored only on this device. Export a backup now and then.</div>
  <div style="display:flex;gap:8px"><button class="btn-o" style="flex:1" data-a="export">Export backup</button><label class="btn-o" style="flex:1;cursor:pointer">Import backup<input type="file" accept="application/json,.json" data-c="import" style="display:none"></label></div>
  <button class="link" style="color:#8A2018;align-self:flex-start;padding-left:0" data-a="reset">Erase all data</button>`;
  return h;
}

function retroSheet(sh) {
  const d = sh.draft, rm = runMin(), tot = Object.values(d).reduce((a, b) => a + b, 0) + rm, full = tot + 15 > S.capital;
  const orig = id => Math.max(0, loggedToday(id)), changed = Object.keys(d).some(k => d[k] !== orig(k));
  return `<div class="sh-head"><div class="eyebrow">Log past time · today</div><button class="link" style="color:#6B7983" data-a="close">Cancel</button></div>
  <div style="display:flex;flex-direction:column;gap:4px"><div class="h2" style="font-size:22px">Where did the untracked time go?</div><div class="muted"><strong style="font-weight:600;color:#0F1B23">${fmt(tot)}</strong> of ${fmt(S.capital)} capital accounted for.</div></div>
  <div style="height:6px;border-radius:3px;background:#EEF1F3;overflow:hidden"><div style="height:100%;width:${Math.min(100, tot / Math.max(1, S.capital) * 100)}%;background:${full ? '#FBB040' : '#1FA8CD'};border-radius:3px"></div></div>
  <div>${[...S.sips, MISC].map(s => { const df = d[s.id] - orig(s.id);
    return `<div style="display:flex;align-items:center;gap:12px;height:56px;border-bottom:1px solid #EEF1F3"><span style="width:28px;font-size:20px;text-align:center">${s.emoji}</span><span style="flex:1;display:flex;flex-direction:column;min-width:0"><span style="font-size:15px;font-weight:600">${esc(s.name)}</span><span style="font-size:12px;font-weight:${df ? 500 : 300};color:${df > 0 ? '#3D8575' : df < 0 ? '#8A2018' : '#6B7983'}">${df ? `${df > 0 ? '+' : '−'}${fmt(Math.abs(df))} vs. before` : d[s.id] ? 'today so far' : '—'}</span></span><button class="step" data-a="rd" data-id="${s.id}">−</button><span class="val">${fmt(d[s.id])}</span><button class="step ${full ? 'off' : ''}" data-a="ri" data-id="${s.id}">+</button></div>`; }).join('')}</div>
  ${sh.warn ? `<div class="warn">That goes past your ${fmt(S.capital)} daily capital. Reduce your number from anything else before logging here.</div>` : ''}
  <div style="font-size:12px;font-weight:300;color:#6B7983">Misc is productive time you don't want to categorise yet. It counts as invested but not toward any index.</div>
  <button class="btn" data-a="rsave" ${changed ? '' : 'disabled'}>${changed ? 'Save to today' : 'No changes yet'}</button>`;
}

function checkSheet(sh) {
  const s = S.sips.find(x => x.id === sh.id); if (!s) return '';
  if (sh.step === 'done') {
    const inv = fmt(totalMin(s.id));
    const title = sh.d > 0 ? "It's compounding." : sh.d === 0 ? 'Holding steady.' : 'Noted. Dips happen.';
    const line = sh.d >= 0 ? `${inv} of ${esc(s.name)} has moved your ${esc(s.signal)} from 100 to ${Math.round(sh.to)}.` : `${esc(s.name)} is at ${Math.round(sh.to)}. One dip doesn't undo ${inv}.`;
    return `<div class="eyebrow">${esc(s.name)} index</div><div style="display:flex;align-items:baseline;gap:12px"><span style="font-size:22px;font-weight:600;color:#96A1A9">${Math.round(sh.from)}</span><span style="font-size:22px;color:#96A1A9">→</span><span style="font-size:52px;font-weight:700;letter-spacing:-.03em;line-height:1;font-variant-numeric:tabular-nums">${Math.round(sh.to)}</span></div>
    <div style="font-size:26px;font-weight:700;letter-spacing:-.02em;line-height:1.2">${title}</div><div style="font-size:16px;font-weight:500;line-height:1.5;color:#2E3E48;text-wrap:pretty">${line}</div><div style="font-size:14px;font-weight:300;color:#6B7983">Next check-in after ${S.checkH}h more, or in ${S.checkD} days.</div><button class="btn" data-a="close">Keep investing</button>`;
  }
  const { gap } = gapOf(s), hasJ = S.journal.some(j => j.sip === s.id);
  const q = gap > 2 ? `It's been ${gap} days. Your ${esc(s.signal)} has…` : `Since ${hasJ ? sinceLabel(s.lastCheck) : 'you started'}, your ${esc(s.signal)} has…`;
  return `<div class="sh-head"><div class="eyebrow">Check in · ${s.emoji} ${esc(s.name)} · ${fmt(s.sinceMin)} in</div><button class="link" style="color:#6B7983" data-a="close">Later</button></div>
  <div class="h2">${q}</div>
  <div class="opts">${RATE.map((r, i) => `<button class="opt ${sh.rate === i ? 'on' : ''}" data-a="rate" data-v="${i}"><span style="font-size:15px;font-weight:600">${r.l}</span><span style="font-size:11px;color:#6B7983">${r.d ? `${r.d > 0 ? '+' : '−'}${Math.abs(r.d)}%` : '±0'}</span></button>`).join('')}</div>
  <div style="display:flex;flex-direction:column;gap:8px"><div style="font-size:13px;font-weight:500;color:#485863">What changed? (optional)</div><div class="tags">${FEEL.map(f => `<button class="tag ${sh.tags.includes(f) ? 'on' : ''}" data-a="tag" data-v="${esc(f)}">${esc(f)}</button>`).join('')}</div></div>
  ${s.countable ? `<div style="display:flex;flex-direction:column;gap:8px"><div style="font-size:13px;font-weight:500;color:#485863">Time it saved, if you know it</div><div style="display:grid;grid-template-columns:repeat(5,1fr);gap:8px">${[0, 15, 30, 60, 120].map(v => `<button class="tag ${sh.amt === v ? 'on' : ''}" style="height:40px;border-radius:12px" data-a="amt" data-v="${v}">${v === 0 ? 'None' : v < 60 ? v + 'm' : v / 60 + 'h'}</button>`).join('')}</div></div>` : ''}
  <input class="field" placeholder="In your own words (optional)" value="${esc(sh.note)}" data-i="note">
  <button class="btn" data-a="csave" ${sh.rate === null ? 'disabled' : ''}>Save check-in</button>`;
}

function sheetView() {
  const sh = U.sheet; if (!sh) return '';
  const body = sh.type === 'settings' ? settingsSheet(sh) : sh.type === 'retro' ? retroSheet(sh) : checkSheet(sh);
  return `<div class="scrim" data-a="close"><div class="sheet" data-a="noop">${body}</div></div>`;
}

const app = document.getElementById('app');
function render() {
  const sh = document.querySelector('.sheet'), st = sh ? sh.scrollTop : 0;
  app.innerHTML = topBar() + (U.tab === 'today' ? todayView() : returnsView()) + sheetView() + (U.toast ? `<div class="toast">${esc(U.toast)}</div>` : '');
  const sh2 = document.querySelector('.sheet'); if (sh2) sh2.scrollTop = st;
  document.body.style.overflow = U.sheet ? 'hidden' : '';
}

function openRetro() { const d = {}; [...S.sips, MISC].forEach(s => d[s.id] = Math.max(0, Math.round(loggedToday(s.id)))); U.sheet = { type: 'retro', draft: d, warn: false }; }

function act(a, id, v) {
  const sh = U.sheet, t = today(), s = id ? S.sips.find(x => x.id === id) : null;
  switch (a) {
    case 'noop': return;
    case 'tab': U.tab = v; break;
    case 'settings': U.sheet = { type: 'settings' }; break;
    case 'close': U.sheet = null; break;
    case 'sel': U.sel = id || null; break;
    case 'start': if (S.run) return; S.run = { sip: id, start: Date.now() }; break;
    case 'stop': {
      const r = S.run, m = (Date.now() - r.start) / 6e4, sp = sipById(r.sip) || MISC, before = todayMin(r.sip) - m;
      S.run = null;
      if (m < 1) { persist(); toast('Under a minute, not logged'); return; }
      S.entries.push({ id: uid(), sip: r.sip, date: dstr(new Date(r.start)), start: r.start, end: Date.now(), min: Math.round(m * 10) / 10, kind: 'timer' });
      const rec = onInvest(r.sip, m), after = todayMin(r.sip);
      persist();
      toast(sp.goal && before < sp.goal && after >= sp.goal ? `${sp.emoji} ${sp.name} goal met · ${fmt(after)} today` : rec > 0 ? `${sp.emoji} ${sp.name} recovering · +${rec}` : `${sp.emoji} +${fmt(m)} into ${sp.name}`);
      return;
    }
    case 'retro': openRetro(); break;
    case 'ri': { const tot = Object.values(sh.draft).reduce((x, y) => x + y, 0) + runMin() + 15; if (tot > S.capital) sh.warn = true; else { sh.draft[id] += 15; sh.warn = false; } break; }
    case 'rd': sh.draft[id] = Math.max(0, sh.draft[id] - 15); sh.warn = false; break;
    case 'rsave': {
      for (const k in sh.draft) { const df = sh.draft[k] - Math.max(0, Math.round(loggedToday(k))); if (!df) continue; S.entries.push({ id: uid(), sip: k, date: t, min: df, kind: 'manual' }); onInvest(k, df); }
      U.sheet = null; persist(); toast('Today updated'); return;
    }
    case 'check': U.sheet = { type: 'check', id, step: 'ask', rate: null, tags: [], note: '', amt: 0 }; break;
    case 'rate': sh.rate = Number(v); break;
    case 'tag': sh.tags = sh.tags.includes(v) ? sh.tags.filter(x => x !== v) : [...sh.tags, v]; break;
    case 'amt': sh.amt = Number(v); break;
    case 'csave': {
      if (sh.rate === null) return;
      const c = S.sips.find(x => x.id === sh.id), r = RATE[sh.rate], from = cur(c), to = from * (1 + r.d / 100);
      c.idx = to; c.idxDate = t; c.lastCheck = t; c.sinceMin = 0; setHist(c, to); if (c.countable) c.saved = (c.saved || 0) + sh.amt;
      S.journal.unshift({ id: uid(), sip: c.id, date: t, rate: sh.rate, tags: sh.tags, note: sh.note.trim(), amt: sh.amt });
      U.sheet = { type: 'check', id: c.id, step: 'done', from, to, d: r.d }; break;
    }
    case 'cap': S.capital = Math.max(0, Math.min(1440, S.capital + Number(v))); break;
    case 'ch': S.checkH = Math.max(1, Math.min(24, S.checkH + Number(v))); break;
    case 'cd': S.checkD = Math.max(1, Math.min(14, S.checkD + Number(v))); break;
    case 'goal': s.goal = Math.max(0, Math.min(S.capital, (s.goal || 0) + Number(v))); break;
    case 'emo': sh.emojiFor = sh.emojiFor === id ? null : id; break;
    case 'pick': s.emoji = v; sh.emojiFor = null; break;
    case 'color': s.color = COLORS[(COLORS.indexOf(s.color) + 1) % COLORS.length]; break;
    case 'del':
      if (S.sips.length <= 1) { toast('Keep at least one SIP'); return; }
      if (!confirm(`Delete ${s.name}? Its logged time and check-ins will be hidden.`)) return;
      S.sips = S.sips.filter(x => x.id !== id); if (S.run && S.run.sip === id) S.run = null; if (U.sel === id) U.sel = null; break;
    case 'add': { const n = S.sips.length, ns = mkSip(uid(), 'New SIP', EMOJIS[(n + 5) % EMOJIS.length], COLORS[n % COLORS.length], 0, 'progress'); S.sips.push(ns); sh.emojiFor = ns.id; break; }
    case 'export': {
      const name = `time-capital-${t}.json`, blob = new Blob([JSON.stringify(S)], { type: 'application/json' }), file = new File([blob], name, { type: 'application/json' });
      if (navigator.canShare && navigator.canShare({ files: [file] })) navigator.share({ files: [file], title: 'Time is capital backup' }).catch(() => {});
      else { const el = document.createElement('a'); el.href = URL.createObjectURL(blob); el.download = name; el.click(); }
      return;
    }
    case 'reset': if (!confirm('Erase all SIPs, time and check-ins on this device?')) return; S = defaults(); U = { tab: 'today', sel: null, sheet: null, toast: null }; break;
    default: return;
  }
  persist(); render();
}

document.addEventListener('click', e => { const b = e.target.closest('[data-a]'); if (!b) return; if (b.dataset.a === 'close' && b.classList.contains('scrim') && e.target !== b) return; act(b.dataset.a, b.dataset.id, b.dataset.v); });
document.addEventListener('input', e => { if (e.target.dataset.i === 'note' && U.sheet) U.sheet.note = e.target.value; });
document.addEventListener('change', e => {
  const el = e.target, c = el.dataset.c; if (!c) return;
  const s = el.dataset.id && S.sips.find(x => x.id === el.dataset.id);
  if (c === 'name' && s) s.name = el.value.trim() || s.name;
  else if (c === 'signal' && s) s.signal = el.value.trim() || s.signal;
  else if (c === 'wake' && el.value) S.wake = el.value;
  else if (c === 'import' && el.files[0]) {
    const r = new FileReader();
    r.onload = () => { try { const o = JSON.parse(r.result); if (!Array.isArray(o.sips)) throw 0; S = o; persist(); U.sheet = null; render(); toast('Backup restored'); } catch (x) { toast("That file isn't a valid backup"); } };
    r.readAsText(el.files[0]); return;
  }
  persist(); render();
});
setInterval(() => { if (!U.sheet) render(); }, 1000);
document.addEventListener('visibilitychange', () => { if (!document.hidden) render(); });
render();
